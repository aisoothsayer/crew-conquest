<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crew Conquest · Match view</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d19;color:#ecf8ff;font-family:system-ui}header{height:56px;box-sizing:border-box;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;background:#101c30}h1{font-size:22px;margin:0;letter-spacing:.06em}#status{color:#91ddeb}#stage{position:absolute;inset:56px 0 0}iframe{width:100%;height:100%;border:0;pointer-events:none}#standby{height:100%;display:grid;place-content:center;text-align:center}#standby h2{font-size:40px;margin:0}#standby p{font-size:22px;color:#acbfd8}
</style></head><body><header><h1>CREW CONQUEST</h1><span id="status">Waiting for Danny’s next match</span></header><main id="stage"><section id="standby"><h2>The crew takes over.</h2><p>Danny’s next match will appear here automatically.</p></section></main><script>
let current=null,loading=false,frame=null,ready=false,refreshed=0;const stage=document.getElementById('stage'),status=document.getElementById('status');
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame?.contentWindow||event.data?.type!=='crew-match-ready'||event.data.gameID!==current)return;ready=true;frame.style.visibility='visible';document.getElementById('loading-match')?.remove();});
function follow(match){current=match.gameID;ready=false;refreshed=Date.now();frame=document.createElement('iframe');frame.title='Read-only full match';frame.style.visibility='hidden';frame.src=match.path+'?spectate&obs=1';const panel=document.createElement('section');panel.id='loading-match';panel.style.cssText='position:absolute;inset:0;display:grid;place-content:center;font-size:28px';panel.textContent='Loading the full match…';stage.replaceChildren(frame,panel);}
async function poll(){if(loading)return;loading=true;try{const r=await fetch('/crew-api/observer-current',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error();const match=await r.json();if(match?.live){status.textContent=match.map+' · Live match';if(current!==match.gameID||(!ready&&Date.now()-refreshed>60000)||Date.now()-refreshed>7200000)follow(match);}else if(match&&current){status.textContent='Round finished · Waiting for Danny’s next match';}else{current=null;frame=null;stage.innerHTML='<section id="standby"><h2>The crew takes over.</h2><p>Danny’s next match will appear here automatically.</p></section>';status.textContent='Waiting for Danny’s next match';}}catch{status.textContent='Reconnecting to the match…';}finally{loading=false;}}
poll();setInterval(poll,5000);
</script></body></html>
